<!-- ═══════════ 2) التصميم (الألوان في أول سطر :root) ═══════════ -->
<style>
:root{--navy:#0b2250;--navy2:#16408a;--blue:#1f6fd1;--orange:#f28a1e;--bg:#eef3fa;--text:#13233f;--muted:#5d6b85;--line:#dfe7f3;--wa:#18b556;--fb:#1877f2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

.hero{background:radial-gradient(circle at 80% 0%,rgba(242,138,30,.35),transparent 45%),linear-gradient(165deg,var(--navy),var(--navy2));color:#fff;text-align:center;padding:30px 18px 90px;border-radius:0 0 40px 40px}
.logo-badge{width:170px;height:170px;border-radius:50%;background:#fff;margin:0 auto 12px;display:grid;place-items:center;box-shadow:0 0 0 7px rgba(255,255,255,.16),0 20px 40px -12px rgba(0,0,0,.55)}
.logo-badge img{width:136px}
.hero h1{font-size:1.7rem;font-weight:900;line-height:1.4}
.hero h1 span{color:#ffb463}
.hero-sub{color:#cfdcf5;font-weight:700;font-size:.92rem;margin-top:4px}

.wrap{max-width:540px;margin:-58px auto 0;padding:0 14px}

/* actions */
.actions{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.act{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px 14px;box-shadow:0 12px 28px -14px rgba(11,34,80,.4);border:2px solid transparent;transition:transform .15s}
.act:active{transform:scale(.97)}
.act-ico{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff}
.act-ico svg{width:30px;height:30px}
.act-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.act-txt b{font-size:1.08rem;font-weight:900;color:var(--navy)}
.act-txt small{font-size:.95rem;color:var(--muted);font-weight:700;text-align:right}
.act-go{font-size:1.9rem;color:#b6c2d8;font-weight:700;line-height:1}
.act-wa{background:linear-gradient(135deg,#1fcb62,#0f9c48);color:#fff}
.act-wa .act-ico{background:rgba(255,255,255,.22)}
.act-wa .act-txt b,.act-wa .act-txt small{color:#fff}
.act-wa .act-go{color:#fff}
.act-fb .act-ico{background:var(--fb)}
.act-ig .act-ico{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af)}

/* phones */
.phone{display:flex;gap:10px;margin-bottom:12px}
.phone .act{flex:1;margin:0}
.phone .act-ico{background:linear-gradient(135deg,var(--blue),var(--navy2))}
.phone .act-txt small{font-size:1.1rem;font-weight:900;color:var(--navy);white-space:nowrap}
.phone .act-txt b{font-size:.95rem}
.phone .act{padding:12px 10px;gap:10px}
.phone .act-ico{width:50px;height:50px}
.phone .act-txt em{font-style:normal;font-size:.8rem;color:var(--muted);font-weight:700}
.copy{flex:none;width:72px;border:0;border-radius:22px;background:var(--navy);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;font-weight:800;font-size:.78rem;box-shadow:0 12px 28px -14px rgba(11,34,80,.5)}
.copy svg{width:22px;height:22px}
.copy.done{background:var(--wa)}

.banner-card{margin-top:18px;border-radius:22px;overflow:hidden;background:#fff;border:3px solid #fff;box-shadow:0 12px 28px -14px rgba(11,34,80,.4)}

.title{font-size:1.4rem;font-weight:900;color:var(--navy);text-align:center;margin:30px 0 14px}
.title::after{content:"";display:block;width:48px;height:4px;border-radius:4px;background:var(--orange);margin:5px auto 0}

.products{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.product-card{background:#fff;border-radius:18px;padding:14px 6px;text-align:center;box-shadow:0 8px 20px -12px rgba(11,34,80,.35)}
.product-icon{width:46px;height:46px;margin:0 auto 6px;border-radius:14px;display:grid;place-items:center;background:#e7f0fd;color:var(--blue)}
.product-icon svg{width:26px;height:26px}
.product-name{font-size:.78rem;font-weight:800;color:var(--navy);line-height:1.4}

.about{background:#fff;border-radius:22px;padding:18px;border-right:5px solid var(--orange);box-shadow:0 8px 20px -12px rgba(11,34,80,.35);color:var(--muted);font-weight:600;font-size:.95rem}

.map-card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 8px 20px -12px rgba(11,34,80,.35)}
.addr{font-weight:800;color:var(--navy);text-align:center;margin-bottom:10px}
.map-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.map-wrap iframe{display:block;width:100%;height:240px;border:0}
.map-btn{display:block;text-align:center;margin-top:12px;padding:13px;border-radius:15px;background:linear-gradient(135deg,#ff6a5c,#e8453c);color:#fff;font-weight:900}

.footer{margin-top:34px;background:var(--navy);color:#cfdcf5;text-align:center;padding:24px 14px 34px;font-weight:700;font-size:.9rem}
.footer small{display:block;opacity:.75;margin-top:4px}

.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:99px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){.hero{padding-top:40px}.wrap{max-width:600px}}
.phone .act{min-width:0}
.phone .act-txt{min-width:0}
.phone .act-txt small{font-size:1rem}
.copy{width:60px}
.act-go{flex:none}
@media(max-width:380px){.phone .act-txt b{font-size:.88rem}.phone .act-ico{width:44px;height:44px}.phone .act-txt small{font-size:.95rem}}

@media(min-width:900px){body{background:linear-gradient(160deg,#dfe9f8,#eef3fa 60%,#fdeedb)}.hero{max-width:640px;margin:24px auto 0;border-radius:40px 40px 40px 40px;padding-bottom:90px}.wrap{max-width:612px}.footer{max-width:640px;margin:34px auto 24px;border-radius:26px}}

/* ===== الكيو آر ===== */
.qr-card{background:#fff;border-radius:22px;padding:20px 14px;text-align:center;box-shadow:0 8px 20px -12px rgba(11,34,80,.35)}
.qr-box{display:inline-block;padding:12px;background:#fff;border-radius:20px;border:2px solid var(--line)}
.qr-box canvas{width:210px;height:210px;display:block}
.qr-note{color:var(--muted);font-weight:700;font-size:.88rem;margin:12px 0}
.qr-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qr-btn{padding:13px;border:0;border-radius:15px;background:var(--navy);color:#fff;font-family:inherit;font-weight:800;font-size:.92rem;cursor:pointer}
.qr-btn:disabled{opacity:.4;cursor:not-allowed}
.qr-btn:active{transform:scale(.97)}

</style>
</head>

    const done = () => { btn.classList.add("done"); toast("تم نسخ الرقم ✓"); setTimeout(() => btn.classList.remove("done"), 1800); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallback());
    } else fallback();

      const ta = document.createElement("textarea");

  function drawQR(text) {
    const canvas = $("qrCanvas"), ctx = canvas.getContext("2d");
    let qr = null;
    for (let type = 3; type <= 20; type++) {
      try { qr = new QRLib.QRCode(type, QRLib.ECL.M); qr.addData(text); qr.make(); break; }
      catch (e) { qr = null; }
    }
    if (!qr) return false;
    const n = qr.getModuleCount(), size = canvas.width;
    const cell = Math.floor(size / (n + 8));
    const off = Math.floor((size - cell * n) / 2);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#0b2250";
    for (let r = 0; r < n; r++)
      for (let c = 0; c < n; c++)
